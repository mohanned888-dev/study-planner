  function searchResults(q) {
    const query=q.trim().toLowerCase();if(!query){$('#global-results').innerHTML='<p class="field-hint">كل أفكارك ومواعيدك، في بحث واحد.</p>';return;}
    const groups=[['المهام',state.tasks,'edit-task','tasks',x=>x.title+' '+x.description],['المواد',state.courses,'open-course','book',x=>x.name+' '+x.code],['الملاحظات',state.notes,'edit-note','notes',x=>x.title+' '+x.body],['الاختبارات',state.exams,'edit-exam','flag',x=>x.title],['البطاقات',state.cards,'edit-card','cards',x=>x.front+' '+x.back]];
    let count=0;const html=groups.map(([label,list,action,ico,text])=>{const matches=list.filter(x=>text(x).toLowerCase().includes(query)).slice(0,6);count+=matches.length;return matches.length?`<div class="search-category">${label}</div>${matches.map(x=>`<button type="button" class="search-result" data-action="${action}" data-id="${x.id}">${icon(ico)}<strong>${esc(x.title||x.name||x.front)}</strong><small>${esc(x.courseId?course(x.courseId).name:'')}</small></button>`).join('')}`:'';}).join('');
    $('#global-results').innerHTML=count?html:empty('مفيش نتائج','جرّب كلمة أقصر أو كتابة مختلفة.','search','',true);
  }
  function downloadFile(name,content,type='application/json') {
    try{const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}catch(_){toast('المتصفح منع التنزيل. جرّب فتح الصفحة في Safari أو Chrome.','error');}
  }

  function exportCalendar() {
    const escapeICS=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    const dt=(date,time)=>date.replace(/-/g,'')+'T'+time.replace(':','')+'00';
    const all=[...state.events,...state.exams.map(e=>({...e,duration:120,kind:'exam'}))];
    if(!all.length){toast('ضيف مواعيد أو اختبارات الأول.');return;}
    const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Madar//Study Planner 1.0//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:مدار — جدولي الدراسي'];
    for(const e of all){const total=M.minutes(e.time)+e.duration,endDate=total>=1440?M.addDays(e.date,1):e.date,endTime=M.clock(total%1440);lines.push('BEGIN:VEVENT',`UID:${e.id}@madar.local`,`DTSTAMP:${stamp}`,`DTSTART:${dt(e.date,e.time)}`,`DTEND:${dt(endDate,endTime)}`,`SUMMARY:${escapeICS(e.title)}`,`DESCRIPTION:${escapeICS(course(e.courseId).name)}`,...(e.location?[`LOCATION:${escapeICS(e.location)}`]:[]),'END:VEVENT');}
    lines.push('END:VCALENDAR');
    // RFC 5545 folds at 75 UTF-8 octets, including multi-byte Arabic text.
    const folded=lines.map(line=>{let out='',bytes=0;for(const ch of line){const size=new TextEncoder().encode(ch).length;if(bytes+size>74){out+='\r\n ';bytes=1;}out+=ch;bytes+=size;}return out;}).join('\r\n')+'\r\n';
    downloadFile('madar-calendar.ics',folded,'text/calendar;charset=utf-8');toast('ملف التقويم جاهز. استورده في تطبيق التقويم.');
  }
  function deleteEntity(kind,id) {
    const configs={task:['tasks','المهمة'],event:['events','الموعد'],exam:['exams','الاختبار'],note:['notes','الملاحظة'],card:['cards','البطاقة'],course:['courses','المادة']};
    const [key,label]=configs[kind],item=state[key].find(x=>x.id===id);if(!item)return;
    confirmAction(`نحذف ${label}؟`,kind==='course'?'المادة وموضوعاتها هتتمسح. مهامها وملاحظاتها ومواعيدها هتفضل موجودة تحت «عام».':`هيتم حذف ${label}. تقدر تتراجع بعد الحذف مباشرة.`,`احذف ${label}`,()=>{
      const previous=JSON.parse(JSON.stringify(state));state[key]=state[key].filter(x=>x.id!==id);
      if(kind==='course'){for(const k of ['tasks','events','exams','notes','cards','sessions'])state[k].forEach(x=>{if(x.courseId===id)x.courseId='';});if(state.timer.courseId===id)state.timer.courseId='';if(ui.cardsCourse===id)ui.cardsCourse='';if(ui.taskCourse===id)ui.taskCourse='';if(ui.noteCourse===id)ui.noteCourse='';}
      if(kind==='task'){state.events.forEach(x=>{if(x.taskId===id)x.taskId='';});state.sessions.forEach(x=>{if(x.taskId===id)x.taskId='';});if(state.timer.taskId===id)state.timer.taskId='';}
      if(kind==='card'&&ui.review)ui.review.queue=ui.review.queue.filter(x=>x!==id);
      save();render();toast(`اتحذفت ${label}.`,'ok','تراجع',()=>{
        if(!state[key].some(x=>x.id===id))state[key].splice(Math.min(previous[key].findIndex(x=>x.id===id),state[key].length),0,item);
        const field=kind==='course'?'courseId':kind==='task'?'taskId':null;
        if(field){
          for(const k of ['tasks','events','exams','notes','cards','sessions'])for(const old of previous[k])if(old[field]===id){const current=state[k].find(x=>x.id===old.id);if(current&&current[field]==='')current[field]=id;}
          if(state.timer[field]===''&&state.timer.runId===previous.timer.runId)state.timer[field]=id;
        }
        save();render();
      });
    });
  }
  async function importBackup(file) {

    try{const data=M.validateBackup(JSON.parse(await file.text()));confirmAction('نسترجع النسخة دي؟',`فيها ${n(data.courses.length)} مواد و${n(data.tasks.length)} مهام. هتستبدل بياناتك الحالية وتوقف الجلسة الجارية. يفضّل تصدّر بياناتك الحالية الأول.`,'استرجاع النسخة',()=>{state=data;ui.review=null;save();render();toast('بياناتك رجعت بنجاح.');});}catch(err){toast(err instanceof SyntaxError?'الملف مش JSON سليم. اختار نسخة مصدّرة من مدار.':err.message,'error');}
  }

    'add-chapter':el=>el.closest('form').requestSubmit(), 'course-task':el=>openTask('',{courseId:el.dataset.id}),
    'new-exam':()=>openExam(), 'edit-exam':el=>openExam(el.dataset.id), 'delete-exam':el=>deleteEntity('exam',el.dataset.id), 'exam-filter':el=>{ui.examFilter=el.dataset.value;render();},
    'prepare-exam':el=>{const e=state.exams.find(x=>x.id===el.dataset.id);if(e)openTask('',{title:'مراجعة لـ '+e.title,courseId:e.courseId,due:M.addDays(e.date,-1)<today()?today():M.addDays(e.date,-1),priority:'high',estimate:90});},
    'new-note':()=>openNote(), 'edit-note':el=>openNote(el.dataset.id), 'delete-note':el=>deleteEntity('note',el.dataset.id),
    'new-card':()=>openCard(), 'edit-card':el=>openCard(el.dataset.id), 'delete-card':el=>deleteEntity('card',el.dataset.id), 'manage-cards':manageCards,
    'start-review':()=>startReview(), 'review-all':()=>startReview(true), 'reveal-card':()=>{ui.reveal=true;render();}, 'rate-card':el=>rateCard(el.dataset.rating),
    'timer-toggle':toggleTimer, 'timer-mode':el=>{if(el.dataset.mode===state.timer.mode)return;const run=()=>resetTimer(el.dataset.mode);if(timerHasProgress())confirmAction('نغيّر نوع الجلسة؟','ده هيلغي الوقت غير المكتمل في الجلسة الحالية.','غيّر الجلسة',run);else run();},
    'timer-reset':()=>{if(timerHasProgress())confirmAction('نبدأ الجلسة من الأول؟','وقت الجلسة غير المكتملة مش هيتسجل.','إعادة الضبط',()=>resetTimer());else resetTimer();},
    'timer-settings':openTimerSettings, 'focus-fullscreen':()=>document.body.classList.toggle('focus-fullscreen'), 'toggle-sound':()=>{state.settings.sound=!state.settings.sound;save();render();toast(state.settings.sound?'صوت النهاية اتفعّل.':'صوت النهاية اتقفل.');},
    'auto-plan':openPlan, 'accept-plan':()=>{if(!ui.planPreview?.events.length)return;const existingIds=new Set(state.events.map(e=>e.id));const additions=ui.planPreview.events.filter(e=>!existingIds.has(e.id));if(additions.some(a=>state.events.some(b=>M.overlap(a,b)))){toast('الجدول اتغيّر. اعمل معاينة جديدة للخطة.','error');return;}state.events.push(...additions);ui.week=M.weekStart(ui.planOptions.startDate);ui.scheduleDate=ui.planOptions.startDate;save();closeModal();render();toast(`اتضافت ${n(additions.length)} جلسة لجدولك.`);},
    'help':help, 'search':openSearch, 'export':exportBackup, 'import':()=>{$('#import-file').value='';$('#import-file').click();}, 'export-calendar':exportCalendar, 'print':()=>window.print(), 'start-fresh':startFresh
  };
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(fn){e.preventDefault();fn(el);}});
  document.addEventListener('submit',e=>{
    const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();
    const f=Object.fromEntries(new FormData(form)),id=form.dataset.id||'',kind=form.dataset.form,trim=k=>String(f[k]||'').trim();
    try {
      if(kind==='task'){
        if(!trim('title'))return formError(form,'اكتب عنوان للمهمة.');
        if(!M.validDate(f.due))return formError(form,'اختار تاريخ صحيح.');
        const old=state.tasks.find(x=>x.id===id),value={id:id||M.uid(),title:trim('title'),description:trim('description'),courseId:f.courseId,due:f.due,priority:f.priority,estimate:Number(f.estimate),done:old?.done||false,completedAt:old?.completedAt||null,createdAt:old?.createdAt||today()};
        if(old)Object.assign(old,value);else state.tasks.push(value);
      }else if(kind==='event'){
        if(!trim('title'))return formError(form,'اكتب عنوان للموعد.');
        if(!M.validDate(f.date)||!M.validTime(f.time))return formError(form,'راجع التاريخ والساعة.');
        if(M.minutes(f.time)+Number(f.duration)>1440)return formError(form,'الموعد لازم يخلص قبل نهاية اليوم. قلّل المدة أو قدّم وقت البداية.');
        const old=state.events.find(x=>x.id===id),repeats=old?1:Number(f.repeat||1),newEvents=Array.from({length:repeats},(_,i)=>({id:i===0&&id?id:M.uid(),title:trim('title'),courseId:f.courseId,date:M.addDays(f.date,i*7),time:f.time,duration:Number(f.duration),kind:f.kind,taskId:old?.taskId||'',done:!!f.done}));
        const conflict=newEvents.find(a=>state.events.some(b=>b.id!==id&&M.overlap(a,b)));
        if(conflict)return formError(form,`فيه تعارض مع موعد موجود يوم ${dateLabel(conflict.date)}. اختار وقت تاني.`);
        if(old)Object.assign(old,newEvents[0]);else state.events.push(...newEvents);
        ui.scheduleDate=f.date;ui.week=M.weekStart(f.date);ui.dashDate=f.date;
      }else if(kind==='course'){
        if(!trim('name'))return formError(form,'اكتب اسم المادة.');
        const old=state.courses.find(x=>x.id===id),chapters=trim('chapters').split('\n').map(x=>x.trim()).filter(Boolean);
        if(chapters.length>300||chapters.some(x=>x.length>200))return formError(form,'الحد ٣٠٠ موضوع، و٢٠٠ حرف لكل موضوع.');
        const value={id:id||M.uid(),name:trim('name'),code:trim('code'),color:f.color||'sage',icon:f.icon,chapters:old?.chapters||chapters.map(title=>({id:M.uid(),title,done:false}))};
        if(old)Object.assign(old,value);else state.courses.push(value);
      }else if(kind==='chapter'){
        const c=state.courses.find(x=>x.id===id);if(!c||!trim('title'))return;if(c.chapters.length>=300)return toast('وصلت للحد الأقصى: ٣٠٠ موضوع لكل مادة.','error');
        c.chapters.push({id:M.uid(),title:trim('title'),done:false});save();render();openCourse(id);return;
      }else if(kind==='exam'){
        if(!trim('title')||!M.validDate(f.date)||!M.validTime(f.time))return formError(form,'راجع اسم وتاريخ ووقت الاختبار.');
        const old=state.exams.find(x=>x.id===id),value={id:id||M.uid(),title:trim('title'),courseId:f.courseId,date:f.date,time:f.time,location:trim('location')};if(old)Object.assign(old,value);else state.exams.push(value);
      }else if(kind==='note'){
        if(!trim('title')||!trim('body'))return formError(form,'اكتب عنوان ونص للملاحظة.');
        const old=state.notes.find(x=>x.id===id),value={id:id||M.uid(),title:trim('title'),body:trim('body'),courseId:f.courseId,color:f.color||'yellow',pinned:!!f.pinned,updatedAt:today()};if(old)Object.assign(old,value);else state.notes.push(value);
      }else if(kind==='card'){
        if(!trim('front')||!trim('back'))return formError(form,'اكتب السؤال وإجابته.');
        const old=state.cards.find(x=>x.id===id),value={id:id||M.uid(),front:trim('front'),back:trim('back'),courseId:f.courseId,due:old?.due||today(),interval:old?.interval||0,reviews:old?.reviews||0};if(old)Object.assign(old,value);else state.cards.push(value);ui.review=null;
      }else if(kind==='settings'||kind==='timer-settings'){
        if(kind==='settings'){if(!trim('name'))return formError(form,'اكتب اسمك الأول.');state.profile={name:trim('name'),subtitle:trim('subtitle')};state.settings.dailyGoal=Number(f.dailyGoal);state.settings.theme=f.dark?'dark':'light';state.settings.sound=!!f.sound;}
        ['focusMinutes','shortBreak','longBreak'].forEach(k=>state.settings[k]=Number(f[k]));
        if(!timerHasProgress())resetTimer();
        save();if(dialog.open)closeModal();render();toast('اتحفظت تفضيلاتك.');return;
      }else if(kind==='plan'){
        ui.planOptions={startDate:f.startDate,days:Number(f.days),startTime:f.startTime,endTime:f.endTime,dailyLimit:Number(f.dailyLimit)};
        if(f.startDate<today())return formError(form,'اختار النهارده أو تاريخ جاي للتخطيط.');
        ui.planPreview=M.planTasks(state,ui.planOptions);$('.form-error',form).hidden=true;showPlan(ui.planPreview);return;
      }
      save();closeModal();render();toast(id?'اتحفظت التعديلات.':'اتضافت لمساحتك.');
    }catch(err){formError(form,err.message||'حصل خطأ. راجع البيانات وحاول تاني.');}
  });
  document.addEventListener('input',e=>{if(e.target.id==='task-search'){ui.taskQuery=e.target.value;$('#task-results').innerHTML=taskResults();}if(e.target.id==='note-search'){ui.noteQuery=e.target.value;$('#note-results').innerHTML=notesResults();}if(e.target.id==='global-search')searchResults(e.target.value);});
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.id==='task-course'){ui.taskCourse=el.value;$('#task-results').innerHTML=taskResults();}
    if(el.id==='task-sort'){ui.taskSort=el.value;$('#task-results').innerHTML=taskResults();}
    if(el.id==='note-course'){ui.noteCourse=el.value;$('#note-results').innerHTML=notesResults();}
    if(el.id==='cards-course'){ui.cardsCourse=el.value;ui.review=null;render();}
    if(el.id==='focus-course'){state.timer.courseId=el.value;state.timer.taskId='';save();}
    if(el.id==='import-file')importBackup(el.files[0]);
    if(el.name==='color'){$$('.color-option',dialog).forEach(label=>{const checked=$('input',label).checked;label.classList.toggle('active',checked);const old=$('svg',label);if(old)old.remove();if(checked)label.insertAdjacentHTML('beforeend',icon('check'));});}
    if(el.closest('[data-form=plan]')){ui.planPreview=null;const btn=$('#accept-plan',dialog);if(btn)btn.disabled=true;const result=$('#plan-result',dialog);if(result)result.innerHTML='';}
  });
  window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(!routes[route])return;ui.route=route;document.body.classList.remove('menu-open','focus-fullscreen');if(dialog.open)closeModal();render();window.scrollTo({top:0,behavior:'instant'});view.focus({preventScroll:true});});
  document.addEventListener('keydown',e=>{
    const typing=e.target.matches('input,textarea,select,[contenteditable=true]');
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}
    if(e.key==='Escape'){document.body.classList.remove('menu-open','focus-fullscreen');return;}
    if(typing||dialog.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key.toLowerCase()==='n'){e.preventDefault();openTask();}
    if(e.code==='Space'&&!e.target.closest('button,a')){if(ui.route==='focus'){e.preventDefault();toggleTimer();}else if(ui.route==='review'&&ui.review?.queue.length&&!ui.reveal){e.preventDefault();ui.reveal=true;render();}}
  });
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  dialog.addEventListener('cancel',()=>{confirmCallback=null;});
  window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){state=load();if(dialog.open)closeModal();ui.review=null;render();}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
  // Complete at most one outstanding session after sleep/reload. Rest never starts itself.
  const initialFinish=M.finishTimer(state);if(initialFinish.finished){state=initialFinish.state;save();}
  render();setInterval(tick,500);
  if(appearanceMigrated)save();
  if(initialWarning)setTimeout(()=>toast(initialWarning,'error'),500);
  if(initialFinish.finished)setTimeout(()=>toast(initialFinish.focus?'الجلسة اللي بدأت قبل ما تقفل الصفحة اكتملت واتسجلت.':'الراحة خلصت. جاهز تكمّل؟'),500);
})();

</script>
